spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

keycloak:
  # Client secret of the medlink-bff client (keycloak/realm-medlink.json)
  client-secret: ${KEYCLOAK_CLIENT_SECRET:dev-only-medlink-bff-secret}
  admin:
    # Service account medlink-admin (same dev value as compose.yaml)
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:dev-only-medlink-admin-secret}

app:
  mfa:
    # Staff code key (application.properties), dev only: 32 bytes in base64 that read as words
    encryption-key: ${APP_MFA_ENCRYPTION_KEY:devOnlyMfaKeyNotForProductionUseLocalOnlyMA=} # gitleaks:allow
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
  # One developer, every call from localhost (React, setup scripts, Newman reruns): the per-IP limits of
  # application.properties would trip after one Postman run. The tests check the real values.
  rate-limit:
    login:
      max: 1000
    register:
      max: 1000
    resend:
      max: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: api-medlink

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
