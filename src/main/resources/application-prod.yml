spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/mydatabase}
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  mail:
    # Real SMTP server: authenticated, TLS required (host and credentials from MAIL_* env)
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  servlet:
    session:
      cookie:
        # HTTPS only (MLink-84), also when TLS ends at the proxy; the XSRF-TOKEN cookie follows (SecurityConfig)
        secure: true

keycloak:
  # Client secret of the medlink-bff client (keycloak/realm-medlink.json)
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  admin:
    # Service account medlink-admin: no default outside dev
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://medlink.example.com}

management:
  # Actuator (metrics included) only on this port, never published outside Docker: Prometheus scrapes it over
  # the private network. The public port keeps /livez and /readyz (GitHub #49).
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.example.apimedlink: INFO
