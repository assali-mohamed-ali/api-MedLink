spring.application.name=api-MedLink
# Run from the host (mvnw spring-boot:run, the IDE): Spring Boot starts the dev dependencies of this file and
# points the app at them. Never docker-compose.yml (the full stack, API included). Not in the jar, off in tests.
spring.docker.compose.file=compose.yaml
# Flyway owns the schema; Hibernate only checks that the entities match it (every profile, tests too).
spring.jpa.hibernate.ddl-auto=validate
# Profils: dev (local) / staging (pre-prod) / prod (docker).
# Ex: SPRING_PROFILES_ACTIVE=staging
# Config détaillée: application-dev.yml / application-staging.yml / application-prod.yml
# Actuator Prometheus exposé via management.endpoints (voir yml par profil).

# Session cookie (the only auth the browser holds): never readable by JS, not sent cross-site.
server.servlet.session.cookie.http-only=true
# Every profile: a session left 15 minutes without a call is over (MLink-83); each call counts as activity.
# Keycloak's SSO session idles out at the same 15 minutes (realm file).
server.servlet.session.timeout=15m
# Strict: no Keycloak redirect comes back any more (decision #58, MLink-84). Secure: application-staging/prod.yml.
server.servlet.session.cookie.same-site=strict

# Mail sent by the API (verification links). Dev: Mailpit (compose.yaml), inbox http://localhost:8025.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:MedLink <no-reply@medlink.local>}
# A mail failure is only logged (the user can ask for a new link): it must not make the API unhealthy.
management.health.mail.enabled=false
# Where the links in our mails point (React pages).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
# At most one "someone tried to sign up with your address" mail per address in this interval.
app.mail.warning-interval=15m

# Keycloak (OIDC login for the auth BFF). Realm/client: keycloak/realm-medlink.json.
# public-url: what the browser reaches; internal-url: what the backend reaches (docker: http://keycloak:8080).
# Explicit endpoints (no issuer-uri) so the app starts even when Keycloak is down.
keycloak.public-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
keycloak.internal-url=${KEYCLOAK_INTERNAL_URL:${keycloak.public-url}}
keycloak.realm=${KEYCLOAK_REALM:medlink}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:medlink-bff}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
# Service account for admin calls (create users, passwords): see KeycloakAdminService.
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:medlink-admin}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
# An open session renews its access token this long before it expires; a refused renewal
# (account disabled, signed out in Keycloak) ends the session. Access tokens live 5 min.
app.session.token-renewal-skew=60s
spring.security.oauth2.client.registration.keycloak.client-id=${keycloak.client-id}
spring.security.oauth2.client.registration.keycloak.client-secret=${keycloak.client-secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.authorization-uri=${keycloak.public-url}/realms/${keycloak.realm}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${keycloak.internal-url}/realms/${keycloak.realm}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${keycloak.internal-url}/realms/${keycloak.realm}/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-info-uri=${keycloak.internal-url}/realms/${keycloak.realm}/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
