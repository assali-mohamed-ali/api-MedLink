# Test-only additions to src/main/resources/application.properties (Spring Boot reads config/ after it, so
# these win). Every test context gets the staff code key the API refuses to start without (MLink-62).
app.mfa.encryption-key=functionalTestMfaKeyFunctionalTestMfaKeyAAA=
# Patient documents (MLink-123/125): dummy test values, never a real key or object store. Document
# functional tests replace the endpoint/credentials with the lazy Testcontainers MinIO; other contexts
# only need the properties to be valid and never connect.
app.documents.max-size=10MB
app.documents.storage.endpoint=http://localhost:9100
app.documents.storage.access-key=medlink-test
app.documents.storage.secret-key=medlink-test-secret
app.documents.storage.bucket=medlink-documents
app.documents.storage.create-bucket=false
app.documents.storage.require-tls=false
app.documents.encryption.active-version=1
app.documents.encryption.keys.1=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
