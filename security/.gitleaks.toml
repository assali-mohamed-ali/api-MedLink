title = "api-MedLink gitleaks config"

# Keep gitleaks' built-in rules (AWS keys, private keys, generic-api-key, ...)
# and add ours on top. Without this, [[rules]] below would replace them all.
[extend]
useDefault = true

[allowlist]
description = "Faux positifs autorisés"
paths = [
  '''security/.gitleaks.toml''',
  '''.*test.*''',
  '''HELP.md''',
]
# Documented placeholders and dev-only values, never real secrets. Exact values only: a dev MinIO
# password or document key must not allowlist anything else on a line.
regexes = [
  '''change-me''',
  '''dev-only-''',
  '''at-least-32-chars''',
  '''^minioadmin$''',
  '''^devOnlyMfaKeyNotForProductionUseLocalOnlyMA=$''',
  '''^ZGV2T25seURvY3VtZW50c0tleU5vdEZvclByb2QhISE=$''',
]
# A single reviewed finding already in history: add its fingerprint to /.gitleaksignore.

[[rules]]
description = "JWT / secrets génériques"
id = "generic-jwt"
# Literal values only: "$VAR", "${VAR:-x}" and "$(cmd)" are not secrets.
regex = '''(?i)(?:jwt_secret|api[_-]?key|secret)\s*[:=]\s*['\"]([^'\"$\s]{8,})['\"]'''
secretGroup = 1
tags = ["secret"]
