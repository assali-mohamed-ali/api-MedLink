services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'

  # Keycloak has its own database (separate container + volume), never the app's one.
  keycloak-db:
    image: 'postgres:16'
    labels:
      # not the app datasource: hide it from spring-boot-docker-compose
      org.springframework.boot.ignore: 'true'
    environment:
      - 'POSTGRES_DB=keycloak'
      - 'POSTGRES_USER=keycloak'
      - 'POSTGRES_PASSWORD=keycloak-dev'
    volumes:
      - 'keycloak-db-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.7.5'
    command: ['start-dev', '--import-realm']
    labels:
      org.springframework.boot.ignore: 'true'
    environment:
      - 'KC_DB=postgres'
      - 'KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak'
      - 'KC_DB_USERNAME=keycloak'
      - 'KC_DB_PASSWORD=keycloak-dev'
      - 'KC_BOOTSTRAP_ADMIN_USERNAME=admin'
      - 'KC_BOOTSTRAP_ADMIN_PASSWORD=admin'
      - 'KC_HOSTNAME=http://localhost:8180'
      - 'KC_HTTP_ENABLED=true'
      - 'KC_HEALTH_ENABLED=true'
      # Placeholders resolved inside keycloak/realm-medlink.json at import (dev values only)
      - 'KC_BFF_CLIENT_SECRET=dev-only-medlink-bff-secret'
      - 'KC_BFF_BASE_URL=http://localhost:8080'
      - 'KC_DEV_USERS_PASSWORD=MedLink-Dev-2026!'
    volumes:
      - './keycloak/realm-medlink.json:/opt/keycloak/data/import/realm-medlink.json:ro'
    ports:
      - '8180:8080'
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  keycloak-db-data:
