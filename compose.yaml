# Dev dependencies; the API runs on the host: ./mvnw spring-boot:run (or the setup scripts).
# Fixed dev-only values, never .env: they match application-dev.yml. The full stack in containers is
# docker-compose.yml: the same services, kept alike by ComposeFilesTest; only the secrets differ there.
services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
      # Postgres 18 otherwise looks for its data in /var/lib/postgresql/<major>/docker.
      - 'PGDATA=/var/lib/postgresql/data'
    ports:
      # any free host port: Spring Boot's compose integration gives it to the app
      - '5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-myuser}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Keycloak has its own database (separate container + volume), never the app's one.
  keycloak-db:
    image: 'postgres:18'
    labels:
      # not the app datasource: hide it from spring-boot-docker-compose
      org.springframework.boot.ignore: 'true'
    environment:
      - 'POSTGRES_DB=keycloak'
      - 'POSTGRES_USER=keycloak'
      - 'POSTGRES_PASSWORD=keycloak-dev'
      - 'PGDATA=/var/lib/postgresql/data'
    volumes:
      - 'keycloak-db-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.8.1'
    command: ['start-dev', '--import-realm']
    labels:
      org.springframework.boot.ignore: 'true'
    environment:
      - 'KC_DB=postgres'
      - 'KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak'
      - 'KC_DB_USERNAME=keycloak'
      - 'KC_DB_PASSWORD=keycloak-dev'
      - 'KC_BOOTSTRAP_ADMIN_USERNAME=admin'
      - 'KC_BOOTSTRAP_ADMIN_PASSWORD=admin'
      - 'KC_HOSTNAME=http://localhost:8180'
      - 'KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true'
      - 'KC_HTTP_ENABLED=true'
      - 'KC_HEALTH_ENABLED=true'
      - 'KC_METRICS_ENABLED=true'
      # Placeholders resolved inside keycloak/realm-medlink.json at import (dev values only)
      - 'KC_BFF_CLIENT_SECRET=dev-only-medlink-bff-secret'
      - 'KC_ADMIN_CLIENT_SECRET=dev-only-medlink-admin-secret'
      - 'KC_BFF_BASE_URL=http://localhost:8080'
      - 'KC_DEV_USERS_PASSWORD=MedLink-Dev-2026!'
    volumes:
      - './keycloak/realm-medlink.json:/opt/keycloak/data/import/realm-medlink.json:ro'
    ports:
      - '8180:8080'
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # no curl in the image: plain HTTP over bash /dev/tcp on the management port
      test: ['CMD', 'bash', '-c', "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Catches every mail the API sends in dev: inbox at http://localhost:8025, SMTP on 1025.
  mailpit:
    image: 'axllent/mailpit:v1.31.5'
    labels:
      org.springframework.boot.ignore: 'true'
    ports:
      - '1025:1025'
      - '8025:8025'

  # Optional full stack: docker compose --profile full up --build
  # The default profile stays A (API on the host), so spring-boot:run never starts this container.
  app:
    profiles: ['full']
    image: ${APP_IMAGE:-api-medlink:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - 'SPRING_PROFILES_ACTIVE=dev'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydatabase'
      - 'SPRING_DATASOURCE_USERNAME=myuser'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
      - 'KEYCLOAK_PUBLIC_URL=http://localhost:8180'
      - 'KEYCLOAK_INTERNAL_URL=http://keycloak:8080'
      - 'KEYCLOAK_REALM=medlink'
      - 'KEYCLOAK_CLIENT_ID=medlink-bff'
      - 'KEYCLOAK_CLIENT_SECRET=dev-only-medlink-bff-secret'
      - 'KEYCLOAK_ADMIN_CLIENT_SECRET=dev-only-medlink-admin-secret'
      - 'MAIL_HOST=mailpit'
      - 'MAIL_PORT=1025'
      - 'MAIL_USERNAME='
      - 'MAIL_PASSWORD='
      - 'MAIL_FROM=MedLink <no-reply@medlink.local>'
      - 'APP_FRONTEND_URL=http://localhost:3000'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  pgdata:
  keycloak-db-data:
