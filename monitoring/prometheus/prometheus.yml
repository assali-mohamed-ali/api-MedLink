global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: api-medlink-prod
    metrics_path: /actuator/prometheus
    static_configs:
      # the private management port (GitHub #49), never published outside Docker
      - targets: ['app:9000']
        labels: { env: prod }
    scrape_interval: 15s
  - job_name: api-medlink-staging
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app-staging:9000']
        labels: { env: staging }
    scrape_interval: 15s
