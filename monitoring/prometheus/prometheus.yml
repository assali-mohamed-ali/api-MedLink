global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: api-medlink
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']
    scrape_interval: 15s
