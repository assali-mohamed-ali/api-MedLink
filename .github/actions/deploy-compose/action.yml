name: Deploy the compose stack over SSH
description: Read the secrets from Vault, pull an immutable image on a Docker host and roll out the API service.

inputs:
  host:
    description: SSH host of the deployment target
    required: true
  user:
    description: SSH user that can run Docker Compose
    required: true
  path:
    description: Absolute directory that holds the compose file and .env
    required: true
  health_url:
    description: URL of the deployed /readyz endpoint (public port; Actuator itself is on the private management port)
    required: true
  ssh_key:
    description: Private SSH key allowed to deploy
    required: true
  known_hosts:
    description: Pinned SSH host key(s) for the target
    required: true
  settings_file:
    description: Non-secret settings of the environment, in this repository (deploy/env/<environment>.env)
    required: true
  vault_addr:
    description: Address of Vault
    required: true
  vault_role:
    description: Vault role of this repository and GitHub environment (api-staging or api-production)
    required: true
  vault_path:
    description: Secrets path under the medlink/ engine (staging/api or prod/api)
    required: true
  image:
    description: Immutable image reference (repository@sha256:digest)
    required: true
  ghcr_token:
    description: Token used on the target to pull from GHCR
    required: true

runs:
  using: composite
  steps:
    - name: Validate deployment inputs
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_PATH: ${{ inputs.path }}
        DEPLOY_HEALTH_URL: ${{ inputs.health_url }}
        DEPLOY_SSH_KEY: ${{ inputs.ssh_key }}
        DEPLOY_KNOWN_HOSTS: ${{ inputs.known_hosts }}
        DEPLOY_SETTINGS_FILE: ${{ inputs.settings_file }}
        VAULT_ADDR: ${{ inputs.vault_addr }}
        VAULT_ROLE: ${{ inputs.vault_role }}
        VAULT_SECRET_PATH: ${{ inputs.vault_path }}
        DEPLOY_IMAGE: ${{ inputs.image }}
        GHCR_TOKEN: ${{ inputs.ghcr_token }}
      run: |
        for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_HEALTH_URL DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS \
          DEPLOY_SETTINGS_FILE VAULT_ADDR VAULT_ROLE VAULT_SECRET_PATH DEPLOY_IMAGE GHCR_TOKEN; do
          if [ -z "${!name}" ]; then
            echo "::error::$name is not set. Define it in the GitHub Environment."
            exit 1
          fi
        done
        test -f "$DEPLOY_SETTINGS_FILE"

    - name: Read the secrets from Vault
      id: secrets
      shell: bash
      env:
        VAULT_ADDR: ${{ inputs.vault_addr }}
        VAULT_ROLE: ${{ inputs.vault_role }}
        VAULT_SECRET_PATH: ${{ inputs.vault_path }}
        DEPLOY_SETTINGS_FILE: ${{ inputs.settings_file }}
        DEPLOY_PATH: ${{ inputs.path }}
        DEPLOY_IMAGE: ${{ inputs.image }}
      run: |
        set -uo pipefail
        umask 077
        rm -f "$RUNNER_TEMP/secrets.json" "$RUNNER_TEMP/deploy.env" "$RUNNER_TEMP/backup.env"
        vault_read() {
          local jwt token read_ok=1
          # GitHub's OIDC token for this job, valid only for this repository and GitHub environment
          jwt="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=medlink-vault" | jq -r '.value // empty')" || return 1
          [ -n "$jwt" ] || return 1
          echo "::add-mask::$jwt"
          token="$(jq -n --arg jwt "$jwt" --arg role "$VAULT_ROLE" '{jwt: $jwt, role: $role}' |
            curl -fsS -X POST --data @- "$VAULT_ADDR/v1/auth/jwt-github/login" |
            jq -r '.auth.client_token // empty')" || return 1
          [ -n "$token" ] || return 1
          echo "::add-mask::$token"
          if ! curl -fsS -H "X-Vault-Token: $token" "$VAULT_ADDR/v1/medlink/data/$VAULT_SECRET_PATH" |
            jq .data.data > "$RUNNER_TEMP/secrets.json"; then
            read_ok=0
          fi
          curl -fsS -X POST -H "X-Vault-Token: $token" "$VAULT_ADDR/v1/auth/token/revoke-self" > /dev/null || true
          [ "$read_ok" -eq 1 ] && [ -s "$RUNNER_TEMP/secrets.json" ]
        }
        secrets_source=server
        if vault_read; then
          secrets_source=vault
        else
          rm -f "$RUNNER_TEMP/secrets.json"
          echo "::warning::Vault refused or could not return the deployment secrets for $VAULT_ROLE; keeping the existing .env and .backup.env on $DEPLOY_PATH and updating APP_IMAGE only. Restore Vault and rotate secrets if they changed."
        fi
        echo "source=$secrets_source" >> "$GITHUB_OUTPUT"
        [ "$secrets_source" = vault ] || exit 0
        set -e
        jq -r '.[]' "$RUNNER_TEMP/secrets.json" | while IFS= read -r value; do echo "::add-mask::$value"; done
        python3 deploy/render-env.py env "$DEPLOY_SETTINGS_FILE" < "$RUNNER_TEMP/secrets.json" > "$RUNNER_TEMP/deploy.env"
        python3 deploy/render-env.py backup < "$RUNNER_TEMP/secrets.json" > "$RUNNER_TEMP/backup.env"
        rm -f "$RUNNER_TEMP/secrets.json"
        printf "APP_IMAGE='%s'\n" "$DEPLOY_IMAGE" >> "$RUNNER_TEMP/deploy.env"

    - name: Configure SSH
      shell: bash
      env:
        DEPLOY_SSH_KEY: ${{ inputs.ssh_key }}
        DEPLOY_KNOWN_HOSTS: ${{ inputs.known_hosts }}
      run: |
        install -m 700 -d "$HOME/.ssh"
        printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
        chmod 600 "$HOME/.ssh/deploy_key"
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        chmod 644 "$HOME/.ssh/known_hosts"

    - name: Copy the compose files, realm, database scripts and environment files
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_PATH: ${{ inputs.path }}
        DEPLOY_IMAGE: ${{ inputs.image }}
        SECRETS_SOURCE: ${{ steps.secrets.outputs.source }}
      run: |
        set -euo pipefail
        SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/deploy_key")
        ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
          "mkdir -p '$DEPLOY_PATH/keycloak' '$DEPLOY_PATH/docker/postgres/initdb' '$DEPLOY_PATH/monitoring/prometheus' '$DEPLOY_PATH/monitoring/alerts' '$DEPLOY_PATH/scripts'"
        scp -q "${SSH_OPTS[@]}" docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
        scp -q "${SSH_OPTS[@]}" deploy/docker-compose.server.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.server.yml"
        # -p keeps the executable mode: Postgres's entrypoint sources a non-executable *.sh into its own shell (GitHub #57)
        scp -q -p "${SSH_OPTS[@]}" docker/postgres/initdb/10-app-role.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/postgres/initdb/10-app-role.sh"
        scp -q -p "${SSH_OPTS[@]}" scripts/db-backup.sh scripts/db-restore.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/"
        scp -q "${SSH_OPTS[@]}" keycloak/realm-medlink.json "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/keycloak/realm-medlink.json"
        scp -q "${SSH_OPTS[@]}" monitoring/prometheus/prometheus.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/monitoring/prometheus/prometheus.yml"
        scp -q "${SSH_OPTS[@]}" monitoring/alerts/alert-rules.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/monitoring/alerts/alert-rules.yml"

        if [ "$SECRETS_SOURCE" = vault ]; then
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; cat > '$DEPLOY_PATH/.env'" < "$RUNNER_TEMP/deploy.env"
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; cat > '$DEPLOY_PATH/.backup.env'" < "$RUNNER_TEMP/backup.env"
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 600 '$DEPLOY_PATH/.env' '$DEPLOY_PATH/.backup.env'"
          rm -f "$RUNNER_TEMP/deploy.env" "$RUNNER_TEMP/backup.env"
        elif [ "$SECRETS_SOURCE" = server ]; then
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -s '$DEPLOY_PATH/.env' && test -s '$DEPLOY_PATH/.backup.env'" || {
              echo "::error::Vault is unavailable and $DEPLOY_PATH/.env or .backup.env is missing; seed the server first."
              exit 1
            }
          ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sh -s -- '$DEPLOY_PATH' '$DEPLOY_IMAGE'" < deploy/update-app-image.sh
        else
          echo "::error::unknown secrets source '$SECRETS_SOURCE'"
          exit 1
        fi

    - name: Log in to GHCR on the target
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_USER: ${{ inputs.user }}
        GHCR_TOKEN: ${{ inputs.ghcr_token }}
        GHCR_USER: ${{ github.actor }}
      run: |
        SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/deploy_key")
        printf '%s' "$GHCR_TOKEN" | ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
          "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

    - name: Pull and roll out the API container
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_PATH: ${{ inputs.path }}
      run: |
        SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/deploy_key")
        ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
        set -euo pipefail
        cd "$1"
        compose() { docker compose --env-file .env -f docker-compose.yml -f docker-compose.server.yml "$@"; }
        compose pull app
        # The API connects as medlink_app (GitHub #57). The image creates that role only on an empty volume, so give it
        # its login (APP_DB_PASSWORD) on every deploy, before the API starts. The script is safe to run again.
        compose up -d --wait postgres
        compose exec -T postgres bash /docker-entrypoint-initdb.d/10-app-role.sh < /dev/null
        compose up -d --no-build --remove-orphans app
        REMOTE

    - name: Verify the running image digest
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_PATH: ${{ inputs.path }}
        DEPLOY_IMAGE: ${{ inputs.image }}
      run: |
        SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/deploy_key")
        running="$(ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
        set -euo pipefail
        cd "$1"
        cid="$(docker compose --env-file .env -f docker-compose.yml -f docker-compose.server.yml ps -q app)"
        test -n "$cid"
        docker inspect --format '{{.Config.Image}}' "$cid"
        REMOTE
        )"
        if [ "$running" != "$DEPLOY_IMAGE" ]; then
          echo "::error::The running API image is '$running', expected '$DEPLOY_IMAGE'."
          exit 1
        fi
        echo "The API is running $running"

    - name: Check the health endpoint
      shell: bash
      env:
        DEPLOY_HEALTH_URL: ${{ inputs.health_url }}
      run: |
        for attempt in $(seq 1 30); do
          if body="$(curl -fsS --max-time 10 "$DEPLOY_HEALTH_URL")" &&
            jq -e '.status == "UP"' >/dev/null <<<"$body"; then
            echo "Health check passed: $DEPLOY_HEALTH_URL"
            exit 0
          fi
          echo "Waiting for $DEPLOY_HEALTH_URL (attempt $attempt/30)..."
          sleep 5
        done
        echo "::error::The deployed API did not become healthy at $DEPLOY_HEALTH_URL."
        exit 1

    - name: Show the API logs on failure
      if: failure()
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.host }}
        DEPLOY_USER: ${{ inputs.user }}
        DEPLOY_PATH: ${{ inputs.path }}
      run: |
        SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/deploy_key")
        ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE' || true
        set -u
        cd "$1"
        docker compose --env-file .env -f docker-compose.yml -f docker-compose.server.yml logs --tail=200 app
        REMOTE
