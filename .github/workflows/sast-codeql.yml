name: SAST-CodeQL

on:
  push:
    branches: [main, master, staging, prod, develop]
  pull_request:
    branches: [main, master, staging, prod]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          # BLOCKING: extended security queries. New alerts fail the gate
          # via required code-scanning check (configure in branch protection).
          queries: security-extended,security-and-quality

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (autobuild fallback)
        run: |
          chmod +x mvnw || true
          if [ -f mvnw ]; then ./mvnw --no-transfer-progress --fail-fast -DskipTests package;
          else mvn --no-transfer-progress --fail-fast -DskipTests package; fi

      # BLOCKING: analysis errors fail the job; findings surface as
      # code-scanning alerts (SARIF) and block PRs when required.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
