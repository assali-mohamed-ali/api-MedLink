name: SAST-CodeQL

on:
  push:
    branches: [main, master, staging, prod, develop]
  pull_request:
    branches: [main, master, staging, prod]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-extended,security-and-quality

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (autobuild fallback)
        run: |
          if [ -f mvnw ]; then ./mvnw -B -DskipTests package;
          else mvn -B -DskipTests package; fi

      # Code scanning (the Security tab) needs a public repo or GitHub Advanced
      # Security. Set the repo variable CODE_SCANNING_ENABLED=true once it is on;
      # until then the SARIF stays a run artifact and the gate below decides.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
          output: codeql-results
          upload: ${{ vars.CODE_SCANNING_ENABLED == 'true' && 'always' || 'never' }}

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: codeql-results/
          if-no-files-found: warn
          retention-days: 14

      # BLOCKING GATE: fails on any security finding of severity >= 7.0
      # (high/critical), the same bar as Trivy and Dependency-Check.
      - name: Fail on high/critical findings
        run: scripts/ci/sarif-gate.sh 7.0 codeql-results/*.sarif
