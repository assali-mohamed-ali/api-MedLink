name: CD

# Release lifecycle: verify, build once, scan the exact image, generate an SBOM,
# publish by digest, attest/sign, verify before deployment, then deploy by digest.
# Deployment uses Docker Compose over SSH. Kubernetes and Argo CD are not used.

on:
  pull_request:
    branches: [master, main, staging, prod]
  push:
    branches: [staging, prod]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy after security checks
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-scan:
    name: Verify, build and scan exact image
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && ((inputs.target == 'staging' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')) || (inputs.target == 'production' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')))))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Verify and test the application
        run: |
          test -f mvnw
          chmod +x mvnw
          ./mvnw --no-transfer-progress --fail-fast verify

      - name: Define immutable image tag
        id: image
        env:
          SHA: ${{ github.sha }}
        run: echo "tag=ghcr.io/assali-mohamed-ali/api-medlink:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build the runtime image once
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker build --pull --file docker/Dockerfile --tag "$IMAGE" .

      - name: Scan exact image (block on HIGH/CRITICAL)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret,misconfig

      - name: Generate CycloneDX SBOM from exact image
        if: steps.trivy.outcome == 'success' || steps.trivy.outcome == 'failure'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'
          scanners: vuln

      - name: Save the scanned image for promotion
        if: success()
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker save --output image.tar "$IMAGE"

      - name: Upload SBOM for audit even when the vulnerability gate blocks
        if: always() && hashFiles('sbom.cdx.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: api-medlink-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact scanned image
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: api-medlink-image-${{ github.sha }}
          path: image.tar
          if-no-files-found: error
          retention-days: 2

  publish-and-attest:
    name: Publish and attest the scanned image
    needs: build-and-scan
    if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && ((inputs.target == 'staging' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')) || (inputs.target == 'production' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')))))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.ref }}
    steps:
      - name: Download the exact scanned image
        uses: actions/download-artifact@v7
        with:
          name: api-medlink-image-${{ github.sha }}
          path: bundle

      - name: Download the SBOM for the same image
        uses: actions/download-artifact@v7
        with:
          name: api-medlink-sbom-${{ github.sha }}
          path: bundle

      - name: Load the scanned image
        run: docker load --input bundle/image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the already-scanned image and capture digest
        id: publish
        env:
          IMAGE: ${{ needs.build-and-scan.outputs.image_tag }}
        run: |
          set -o pipefail
          docker push "$IMAGE" 2>&1 | tee push.log
          DIGEST="$(grep -Eo 'digest: sha256:[0-9a-f]{64}' push.log | tail -n 1 | cut -d' ' -f2)"
          test -n "$DIGEST" || { echo "::error::Could not obtain the GHCR digest from docker push."; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/assali-mohamed-ali/api-medlink@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/assali-mohamed-ali/api-medlink
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM for the published digest
        uses: actions/attest-sbom@v3
        with:
          subject-name: ghcr.io/assali-mohamed-ali/api-medlink
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: bundle/sbom.cdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign the published image digest
        env:
          IMAGE: ${{ steps.publish.outputs.ref }}
        run: cosign sign --yes "$IMAGE"

  deploy-staging:
    needs: publish-and-attest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR for signature verification
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Verify image signature before deployment
        env:
          IMAGE: ${{ needs.publish-and-attest.outputs.image }}
        run: |
          test -n "$IMAGE"
          cosign verify --certificate-identity-regexp '^https://github.com/assali-mohamed-ali/api-MedLink/.github/workflows/cd.yml@refs/(heads/(master|main|staging|prod)|tags/v.*)$' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"

      - name: Deploy the verified immutable image
        uses: ./.github/actions/deploy-compose
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          path: ${{ vars.DEPLOY_PATH }}
          health_url: ${{ vars.DEPLOY_HEALTH_URL }}
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          env_file: ${{ secrets.DEPLOY_ENV_FILE }}
          image: ${{ needs.publish-and-attest.outputs.image }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  deploy-prod:
    needs: publish-and-attest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR for signature verification
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Verify image signature before deployment
        env:
          IMAGE: ${{ needs.publish-and-attest.outputs.image }}
        run: |
          test -n "$IMAGE"
          cosign verify --certificate-identity-regexp '^https://github.com/assali-mohamed-ali/api-MedLink/.github/workflows/cd.yml@refs/(heads/(master|main|staging|prod)|tags/v.*)$' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"

      - name: Deploy the verified immutable image
        uses: ./.github/actions/deploy-compose
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          path: ${{ vars.DEPLOY_PATH }}
          health_url: ${{ vars.DEPLOY_HEALTH_URL }}
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          env_file: ${{ secrets.DEPLOY_ENV_FILE }}
          image: ${{ needs.publish-and-attest.outputs.image }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
