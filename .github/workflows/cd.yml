name: CD

# Promotion model: feature PR -> master, promote master -> staging,
# validate, then staging -> prod (or tag v* for release).
# SAFEGUARD: master pushes do NOT auto-deploy prod. Only the prod
# branch and v* tags reach the production environment.
#
# Deployment uses Docker Compose over SSH: the workflow builds one image,
# records its immutable digest, then asks the target host to pull that exact
# digest. The GitHub Environment (staging/production) holds the host, key and
# environment file; `production` must require reviewers in the repository
# settings. See docs/DEPLOYMENT.md.

on:
  push:
    branches: [staging, prod]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy (re-run safeguards apply)'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate Maven wrapper
        run: |
          test -f mvnw || (echo "mvnw missing" && exit 1)
          chmod +x mvnw
          ./mvnw --version

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        run: ./mvnw --no-transfer-progress --fail-fast -DskipTests package

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Immutable image reference
        id: image
        run: |
          test -n "${{ steps.build.outputs.digest }}" || {
            echo "::error::The build did not produce an image digest."
            exit 1
          }
          echo "ref=${REGISTRY}/${IMAGE_NAME,,}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    needs: build-push
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Deploy the compose stack
        uses: ./.github/actions/deploy-compose
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          path: ${{ vars.DEPLOY_PATH }}
          health_url: ${{ vars.DEPLOY_HEALTH_URL }}
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          env_file: ${{ secrets.DEPLOY_ENV_FILE }}
          image: ${{ needs.build-push.outputs.image }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  deploy-prod:
    needs: build-push
    # SAFEGUARD: prod deploys only from prod branch, v* tags, or explicit
    # manual dispatch to production (still gated by the environment's
    # required reviewers). master is intentionally excluded.
    if: github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Deploy the compose stack
        uses: ./.github/actions/deploy-compose
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          path: ${{ vars.DEPLOY_PATH }}
          health_url: ${{ vars.DEPLOY_HEALTH_URL }}
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          env_file: ${{ secrets.DEPLOY_ENV_FILE }}
          image: ${{ needs.build-push.outputs.image }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
