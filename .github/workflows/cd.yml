name: CD

# Promotion model: feature PR -> master, promote master -> staging,
# validate, then staging -> prod (or tag v* for release).
# SAFEGUARD: master pushes do NOT auto-deploy prod. Only the prod
# branch and v* tags reach the production environment.

on:
  push:
    branches: [staging, prod]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy (re-run safeguards apply)'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate Maven wrapper
        run: |
          test -f mvnw || (echo "mvnw missing" && exit 1)
          chmod +x mvnw
          ./mvnw --version

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        run: ./mvnw --no-transfer-progress --fail-fast -DskipTests package

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: build-push
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.x

      - name: Validate + plan (staging)
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate
        env:
          TF_VAR_app_image: ${{ needs.build-push.outputs.image }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_db_password: ${{ secrets.STAGING_DB_PASSWORD }}

  deploy-prod:
    needs: build-push
    # SAFEGUARD: prod deploys only from prod branch, v* tags, or explicit
    # manual dispatch to production (still gated by the environment's
    # required reviewers). master is intentionally excluded.
    if: github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.x

      - name: Validate + plan (prod)
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate
        env:
          TF_VAR_app_image: ${{ needs.build-push.outputs.image }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_db_password: ${{ secrets.PROD_DB_PASSWORD }}
