name: AI Contribution Disclosure

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  pull-requests: write

concurrency:
  group: ai-disclosure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-disclosure:
    name: Verify AI disclosure
    runs-on: ubuntu-latest

    steps:
      - name: Validate both AI checklist declarations
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              core.setFailed("Unable to retrieve pull request information.");
              return;
            }

            const body = pr.body || "";
            const aiText = "J'ai utilisé des outils d'IA générative pour contribuer à cette PR.";
            const humanText = "Je confirme avoir relu, compris et validé les modifications proposées par l'IA.";

            const findItems = (text) =>
              body.split(/\r?\n/)
                .map((line) => line.match(/^\s*-\s*\[([ xX])\]\s*(.*?)\s*$/))
                .filter((match) => match && match[2] === text);

            const aiItems = findItems(aiText);
            const humanItems = findItems(humanText);

            let reason = "";

            if (aiItems.length !== 1 || humanItems.length !== 1) {
              reason = "Both AI checklist items must appear exactly once in the PR description.";
            } else {
              const aiChecked = aiItems[0][1].toLowerCase() === "x";
              const humanChecked = humanItems[0][1].toLowerCase() === "x";

              if (aiChecked !== humanChecked) {
                reason = "The AI-use and human-review checkboxes must have the same state: both checked or both unchecked.";
              }
            }

            if (reason) {
              core.error(reason + " This PR will be closed. Correct the checklist and reopen the PR.");
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: "closed"
              });
              core.setFailed(reason);
              return;
            }

            core.info("Both AI checklist items are present exactly once and have matching states.");
