
name: AI Contribution Disclosure

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  pull-requests: read

jobs:
  ai-disclosure:
    name: Verify AI disclosure
    runs-on: ubuntu-latest

    steps:
      - name: Check AI disclosure in PR description
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              core.setFailed("Unable to retrieve pull request information.");
              return;
            }

            const body = pr.body || "";

            const aiDisclosure =
              /^\s*-\s*\[[xX]\]\s*J'ai utilisé des outils d'IA générative pour contribuer à cette PR\.\s*$/m;

            if (!aiDisclosure.test(body)) {
              core.setFailed(
                "AI disclosure is missing or unchecked. " +
                "Update the PR description and check: " +
                "\"J'ai utilisé des outils d'IA générative pour contribuer à cette PR.\""
              );
              return;
            }

            core.info("AI contribution disclosure is present and checked.");
