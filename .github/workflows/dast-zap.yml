name: DAST-ZAP

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging, prod, develop]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-zap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U myuser"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start app
        run: |
          test -f mvnw
          chmod +x mvnw
          ./mvnw --no-transfer-progress --fail-fast -DskipTests package
          # Never expose repository secrets to code under test. This disposable
          # value is only for the isolated CI instance, never production.
          EFFECTIVE_JWT_SECRET="$(printf '%s%s' 'ci-test-secret-not-real-' '1234567890')"
          SPRING_PROFILES_ACTIVE=dev \
          SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/mydatabase \
          SPRING_DATASOURCE_USERNAME=myuser \
          SPRING_DATASOURCE_PASSWORD=secret \
          JWT_SECRET="$EFFECTIVE_JWT_SECRET" \
          nohup java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health; then
              break
            fi
            sleep 10
          done
          curl -sf http://localhost:8080/actuator/health
          tail -100 app.log

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dast-app-log
          path: app.log
          if-no-files-found: warn
          retention-days: 7

      # Baseline scan is unauthenticated; it does not replace authenticated API tests.
      # Tune rules only with a documented justification in security/zap-rules.tsv.
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: 'security/zap-rules.tsv'
          cmd_options: '-c security/zap-rules.tsv'
          allow_issue_writing: false
          fail_action: true
