name: CI

on:
  push:
    branches: [main, master, staging, prod, develop]
  pull_request:
    branches: [main, master, staging, prod, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # GitHub #53: the Terraform container must match the production profile.
      - name: Check the production container configuration
        run: bash scripts/ci/check-prod-config.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.x

      - name: Validate Terraform
        run: |
          cd terraform
          terraform init -backend=false -input=false
          terraform fmt -check
          terraform validate

      - name: Validate Maven wrapper
        run: |
          test -f mvnw || (echo "mvnw missing" && exit 1)
          chmod +x mvnw
          ./mvnw --version

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python for pre-commit
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit

      - name: Run repository pre-commit hooks
        run: pre-commit run --all-files

      # Blocking gate: test/build failures fail the job.
      - name: Build + tests
        run: ./mvnw --no-transfer-progress --fail-fast verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Surefire
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      # Reports are diagnostic artifacts, not a second failure gate.
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7
