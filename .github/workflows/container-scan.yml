name: Container-Scan

on:
  push:
    branches: [main, master, staging, prod, develop]
  pull_request:
    branches: [main, master, staging, prod]

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image (no push)
        run: docker build -f docker/Dockerfile -t api-medlink:${{ github.sha }} .

      # BLOCKING GATE: exit-code 1 fails the job on CRITICAL/HIGH.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          trivy-config: security/trivy.yaml
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      # BLOCKING GATE: exit-code 1 fails the job on CRITICAL/HIGH.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'api-medlink:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      # SARIF keeps findings out of the log: print them (never blocks here).
      - name: Show findings
        if: always()
        run: |
          for f in trivy-config.sarif trivy-image.sarif; do
            if [ -f "$f" ]; then scripts/ci/sarif-gate.sh 11 "$f"; fi
          done

      - name: Upload SARIF artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif
          path: trivy-*.sarif
          if-no-files-found: ignore
          retention-days: 14

      # Code scanning needs a public repo or GitHub Advanced Security:
      # set the repo variable CODE_SCANNING_ENABLED=true once it is on.
      - name: Upload config SARIF
        if: always() && vars.CODE_SCANNING_ENABLED == 'true' && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-config.sarif'
          category: trivy-config

      - name: Upload image SARIF
        if: always() && vars.CODE_SCANNING_ENABLED == 'true' && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image.sarif'
          category: trivy-image
