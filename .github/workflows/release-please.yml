name: Release Please

on:
  push:
    branches: [prod]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-prod
  cancel-in-progress: false

jobs:
  release:
    if: vars.ENABLE_AUTO_PROMOTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
    steps:
      - name: Validate release automation token
        run: |
          test -n "$GH_TOKEN" || {
            echo "::error::Add repository secret PROMOTION_TOKEN with Contents, Pull requests, and Issues read/write permissions."
            exit 1
          }

      - name: Open/update semantic release PR or publish the merged release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.PROMOTION_TOKEN }}
          target-branch: prod
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Add the required disclosure to the generated release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(jq -r '.number // empty' <<< "$PR_JSON")"
          test -n "$PR_NUMBER" || { echo "::error::Release Please returned a PR payload without a number"; exit 1; }
          BODY="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
          if ! grep -Fq "Cette PR n'utilise pas d'outils d'IA générative." <<< "$BODY"; then
            DISCLOSURE="$(cat <<'EOF'
## Utilisation de l'IA

- [x] Cette PR n'utilise pas d'outils d'IA générative.
- [ ] J'ai utilisé des outils d'IA générative pour contribuer à cette PR.
- [ ] Je confirme avoir relu, compris et validé les modifications proposées par l'IA.
EOF
)"
            BODY="$(printf '%s\n\n%s' "$BODY" "$DISCLOSURE")"
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi

      - name: Wait for release PR checks and merge automatically
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(jq -r '.number // empty' <<< "$PR_JSON")"
          if [ -z "$PR_NUMBER" ]; then
            echo "Release Please returned no pull request number; nothing to merge."
            exit 0
          fi
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --fail-fast
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge

      # The release PR changes the Maven version and changelog on prod. Sync
      # those release metadata changes back to staging so future promotions
      # do not roll the version backwards.
      - name: Check out the released branch
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: prod
          fetch-depth: 0

      - name: Sync released version back to staging
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin prod staging
          AHEAD="$(git rev-list --count origin/staging..origin/prod)"
          if [ "$AHEAD" -eq 0 ]; then
            echo "Staging already contains the released commit."
            exit 0
          fi

          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --base staging --head prod --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            SYNC_BODY="$(cat <<'EOF'
Automated sync of the released Maven version and changelog from prod back to staging.

## Utilisation de l'IA

- [x] Cette PR n'utilise pas d'outils d'IA générative.
- [ ] J'ai utilisé des outils d'IA générative pour contribuer à cette PR.
- [ ] Je confirme avoir relu, compris et validé les modifications proposées par l'IA.
EOF
)"
            gh pr create --repo "$GITHUB_REPOSITORY" --base staging --head prod \
              --title "chore: sync released version to staging" --body "$SYNC_BODY"
            PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --base staging --head prod --state open --json number --jq '.[0].number // empty')"
          fi
          test -n "$PR_NUMBER" || { echo "::error::Unable to find/create the prod -> staging sync PR"; exit 1; }
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --fail-fast
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge
