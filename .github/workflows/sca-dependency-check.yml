name: SCA-Dependency-Check

on:
  push:
    branches: [main, master, staging, prod, develop]
  pull_request:
    branches: [main, master, staging, prod]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # BLOCKING GATE: fails on CVSS >= 7. No `|| true` — see
      # security/owasp-suppressions.xml for the only allowed exceptions
      # (each needs expiry + ticket reference). Without NVD_API_KEY the
      # scan still runs with the local mirror (-Dautoupdate=false).
      - name: OWASP Dependency-Check
        run: |
          if [ -n "${NVD_API_KEY:-}" ]; then
            NVD_ARG="-DnvdApiKey=${NVD_API_KEY}"
          else
            NVD_ARG="-Dautoupdate=false"
          fi
          ./mvnw -B org.owasp:dependency-check-maven:check \
            ${NVD_ARG} \
            -DsuppressionFile=security/owasp-suppressions.xml \
            -DfailBuildOnCVSS=7 \
            -Dformat=SARIF
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload SARIF
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: error
          retention-days: 14
