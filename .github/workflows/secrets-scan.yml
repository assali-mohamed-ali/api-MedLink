name: Secrets-Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read
  security-events: write
  # pull_request scans list the PR's commits through the API.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # BLOCKING GATE: any leak fails the job.
      # Rules/allowlist live in security/.gitleaks.toml, reviewed false
      # positives in .gitleaksignore. The action has no `args` input: the
      # config is passed through GITLEAKS_CONFIG.
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/.gitleaks.toml
