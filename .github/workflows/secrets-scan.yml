name: Secrets-Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read
  # The action queries PR commit metadata when scanning pull requests.
  pull-requests: read

concurrency:
  group: secrets-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Blocking gate: any detected leak fails the job.
      # Config and reviewed false positives are maintained in security/.gitleaks.toml
      # and .gitleaksignore respectively.
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/.gitleaks.toml
