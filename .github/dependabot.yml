version: 2

updates:
  # Java dependencies declared in pom.xml.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      maven-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      maven-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  # Pinning actions to full commit SHAs is handled in workflow files;
  # Dependabot keeps those immutable references current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  # Dockerfiles live in /docker. Keep image updates in a separate ecosystem
  # from Compose image references so changes are easy to review and test.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      docker-images:
        applies-to: version-updates
        patterns:
          - "*"

  # Track images declared in both compose.yaml and docker-compose.yml at the
  # repository root; the Docker ecosystem entry above does not cover these.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      compose-images:
        applies-to: version-updates
        patterns:
          - "*"
