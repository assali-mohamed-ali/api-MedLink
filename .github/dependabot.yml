version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      maven-major:
        patterns:
          - '*'
        update-types:
          - major
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      gha-all:
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      docker-all:
        patterns:
          - '*'
    ignore:
      # Pin Java 17 (pom.xml java.version=17). Tags like 3.9-eclipse-temurin-26
      # ne sont pas du semver classique, donc update-types ne suffit pas.
      # On bloque tout tag temurin 21+ par wildcard, on garde les patchs 17.
      - dependency-name: 'maven'
        versions:
          - '*-eclipse-temurin-2*'
          - '*-eclipse-temurin-3*'
          - '*temurin-21*'
          - '*temurin-25*'
          - '*temurin-26*'
      - dependency-name: 'eclipse-temurin'
        versions: ['2*', '21*', '23*', '24*', '25*', '26*', '3*']
