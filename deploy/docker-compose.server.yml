# Overlay for the staging and production hosts (MLink-169), used with docker-compose.yml:
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.server.yml up -d
# Docker's published ports bypass ufw, so only the API publishes one, on the address the environment chooses.
services:
  postgres:
    restart: unless-stopped
    ports: !reset []

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    build: !reset null
    restart: unless-stopped
    ports: !override
      - '${API_BIND_ADDRESS:?API_BIND_ADDRESS must be set}:8080:8080'
    depends_on: !override
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  keycloak-db:
    restart: unless-stopped

  keycloak:
    restart: unless-stopped
    ports: !reset []

  # Development helpers: never started on a server
  mailpit:
    profiles: ['local-only']

  prometheus:
    profiles: ['local-only']

networks:
  default:
    # A fixed gateway: on staging Caddy reaches the API through it, so TRUSTED_PROXIES can name it exactly
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
